openapi: 3.0.3
info:
  title: laverte-home API
  version: "1.0.0"
  description: |
    Homestay booking: 3 nha trong 2 hang (`home`, `nest`). Khach dat theo gio /
    qua dem / theo ngay, khong can tai khoan (ten + so dien thoai), tra tien
    truoc roi slot moi duoc giu. Admin dang nhap bang Google OAuth hoac
    username/password.

    Nhung dieu chua o trong tung endpoint:
    - Chong trung lich do rang buoc `EXCLUDE USING gist` cua Postgres quyet dinh,
      khong phai code — nen 409 SLOT_CONFLICT co the tra ve ngay ca khi truoc do
      client vua thay slot con trong.
    - Booking o `pending_payment` giu slot den `expires_at`; cron quet het han.
    - Moi loi deu dung chung mot body (`Error`), tru vai loi parse tho o tang
      handler tra `{"error": "..."}`.
servers:
  - url: http://localhost:14000
    description: dev
tags:
  - name: public
    description: Khach, khong can dang nhap
  - name: auth
  - name: webhook
  - name: admin
  - name: admin-bookings
  - name: admin-catalog

paths:
  /health:
    get:
      tags: [public]
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, example: true } }

  /api/v1/homes:
    get:
      tags: [public]
      summary: Danh sach nha dang nhan khach
      description: Ban public — khong tra ve `google_calendar_id` hay `is_active`.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicHome" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/homes/{id}/availability:
    get:
      tags: [public]
      summary: Khung gio da kin cua mot nha
      security: []
      description: |
        Tra ve cac khoang **ban**, khong phai khoang trong — phan con lai la trong.
        Khong sinh san slot 30 phut/1 tieng vi bang gia theo gio khong co don vi do
        (base_hours + gio le lam tron len).

        Tinh ca booking `pending_payment` chua tra tien: chung van giu slot trong
        rang buoc exclusion, nen bao trong se dan khach vao mot lan dat chac chan
        409. Khoang tra ve co the chong nhau (mot blocked slot phu len booking co san)
        va khong bi cat theo `from`/`to` — day la nguyen khoang ban that.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - name: from
          in: query
          description: RFC3339 kem offset. Bo trong = bay gio.
          schema: { type: string, format: date-time, example: "2026-08-28T14:00:00+07:00" }
        - name: to
          in: query
          description: RFC3339 kem offset. Bo trong = `from` + 7 ngay. Toi da 30 ngay ke tu `from`.
          schema: { type: string, format: date-time, example: "2026-09-04T14:00:00+07:00" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/bookings:
    post:
      tags: [public]
      summary: Khach tu dat phong
      security: []
      description: |
        Rate limit kep: theo IP va theo so dien thoai da chuan hoa (hai cach viet
        cua cung mot so dung chung mot quota).

        Neu so dien thoai dang giu mot booking `pending_payment`:
        - request **trung khop** (cung home + cung khung gio) -> tra lai chinh
          booking do kem QR cu, khong tao hold moi;
        - request **khac** -> 409 CONFLICT, khong tiet lo booking dang co.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "200":
          description: Da tao hold, tra ve noi dung QR de chuyen khoan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/webhooks/sepay:
    post:
      tags: [webhook]
      summary: Callback thanh toan SePay
      security: []
      description: |
        Xac thuc bang chu ky tren **dung bytes** provider gui, khong phai JWT.
        Booking id doc tu noi dung chuyen khoan dang `<SEPAY_TRANSFER_PREFIX><id>`.
        Idempotent: redelivery cua mot giao dich da xu ly van tra 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Body nguyen ban cua SePay (khong bind, chi verify chu ky).
      responses:
        "200": { description: Da ghi nhan (hoac da xu ly tu truoc) }
        "400":
          description: Khong doc duoc booking id, hoac so tien khong khop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Booking khong con o `pending_payment` — tien da vao bank nhung khong khop duoc booking nao
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/google/login-url:
    get:
      tags: [auth]
      summary: Lay URL dang nhap Google
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { url: { type: string } }

  /api/v1/auth/google/callback:
    post:
      tags: [auth]
      summary: Doi code OAuth lay session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Dang nhap bang username/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Doi refresh token lay session moi
      security: []
      description: Dung lai mot refresh token da xoay se thu hoi ca family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Dang xuat
      description: |
        Chi blacklist access token id hien tai. Refresh token **chua** bi thu hoi
        (xem docs/NEXT-STEPS.md).
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/admins:
    get:
      tags: [admin]
      summary: Danh sach admin
      description: Chi superadmin.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Cap quyen admin cho mot user
      description: Chi superadmin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties: { user_id: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/admins/{id}:
    delete:
      tags: [admin]
      summary: Thu hoi quyen admin
      description: Chi superadmin.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/homes:
    get:
      tags: [admin-catalog]
      summary: Danh sach nha (ban day du)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Home" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin-catalog]
      summary: Tao nha
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHomeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/admin/homes/{id}:
    put:
      tags: [admin-catalog]
      summary: Sua nha
      description: |
        `google_calendar_id` va `is_active` la nullable co chu dich: bo qua key =
        giu nguyen. Gui `null` khac voi gui gia tri rong.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHomeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/pricing-rules:
    get:
      tags: [admin-catalog]
      summary: Bang gia theo hang
      parameters:
        - name: category
          in: query
          required: true
          schema: { type: string, enum: [home, nest] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PricingRule" }
    post:
      tags: [admin-catalog]
      summary: Tao rule gia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertPricingRuleRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/admin/pricing-rules/{id}:
    put:
      tags: [admin-catalog]
      summary: Thay the rule gia (supersede)
      description: |
        Khong sua tai cho: rule cu bi dong lai va mot rule moi duoc tao, de gia
        cua booking da tinh truoc do van truy nguyen duoc.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertPricingRuleRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/blocked-slots:
    get:
      tags: [admin-catalog]
      summary: Khung gio bi khoa cua mot nha
      parameters: [{ $ref: "#/components/parameters/HomeIDQuery" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedSlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [admin-catalog]
      summary: Khoa mot khung gio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [home_id, start_time, end_time]
              properties:
                home_id: { type: integer, format: int64 }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedSlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/blocked-slots/{id}:
    delete:
      tags: [admin-catalog]
      summary: Bo khoa khung gio
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/bookings:
    get:
      tags: [admin-bookings]
      summary: Booking cua mot nha trong mot ngay
      parameters:
        - $ref: "#/components/parameters/HomeIDQuery"
        - name: date
          in: query
          description: "`YYYY-MM-DD`, hieu theo `APP_TIMEZONE` (mac dinh Asia/Ho_Chi_Minh), khong phai TZ cua may chu. Bo trong = hom nay."
          schema: { type: string, format: date, example: "2026-08-28" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [admin-bookings]
      summary: Tao booking walk-in
      description: |
        `paid_cash: true` xac nhan luon (khach tra tien mat tai cho);
        `false` tao hold `pending_payment` nhu luong khach tu dat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWalkInBookingRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/bookings/{id}/cancel:
    patch:
      tags: [admin-bookings]
      summary: Huy booking
      description: Chi tu `pending_payment` hoac `confirmed`. `completed`/`no_show` la trang thai cuoi, khong quay lai duoc.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/bookings/{id}/complete:
    patch:
      tags: [admin-bookings]
      summary: Danh dau da o xong
      description: Chi tu `confirmed`.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/bookings/{id}/no-show:
    patch:
      tags: [admin-bookings]
      summary: Danh dau khach khong den
      description: Chi tu `confirmed`. Tien da tinh vao doanh thu, khong co khai niem hoan tien.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/bookings/{id}/lock-code:
    patch:
      tags: [admin-bookings]
      summary: Dat ma khoa cua
      description: |
        Hien tai chi ghi cot ma, **khong** xoa `lock_code_sent_at`. Doi ma sau khi
        da gui thi lan gui sau se bao thanh cong ma khong gui gi
        (xem docs/NEXT-STEPS.md).
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/bookings/{id}/send-lock-code:
    post:
      tags: [admin-bookings]
      summary: Gui ma khoa cua cho khach
      description: |
        Chi gui duoc mot lan, va chi khi booking dang `confirmed` — dieu kien nam
        trong chinh cau UPDATE. Goi lai sau khi da gui thanh cong se tra 200 ma
        khong gui them.
      parameters: [{ $ref: "#/components/parameters/PathID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/overview:
    get:
      tags: [admin]
      summary: Tong quan doanh thu
      description: |
        Hai con so tren hai dong ho khac nhau va **khong chia duoc cho nhau**:
        `total_revenue_vnd` tinh theo ngay tien ve (`paid_at`),
        `booking_count` tinh theo ngay bat dau o (`start_time`).
      parameters:
        - name: from
          in: query
          description: "`YYYY-MM-DD` theo `APP_TIMEZONE`"
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "`YYYY-MM-DD` theo `APP_TIMEZONE`"
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    HomeIDQuery:
      name: home_id
      in: query
      required: true
      schema: { type: integer, format: int64 }

  responses:
    OK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean, example: true } }
    Session:
      description: Dang nhap thanh cong
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: Du lieu khong hop le
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Chua dang nhap / token khong hop le
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Khong du quyen
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Khong tim thay
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Trung khung gio, hoac trang thai hien tai khong cho phep thao tac nay
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Vuot rate limit

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            [
              INTERNAL_ERROR,
              NOT_FOUND,
              SLOT_CONFLICT,
              BOOKING_EXPIRED,
              PAYMENT_AMOUNT_MISMATCH,
              VALIDATION_ERROR,
              UNAUTHORIZED,
              CONFLICT,
            ]
        code_id: { type: string, example: slot_conflict }
        message: { type: string, example: "khung gio nay vua co nguoi dat, vui long chon gio khac" }

    PublicHome:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: string, enum: [home, nest] }
        address: { type: string }
        description: { type: string }

    Availability:
      type: object
      properties:
        home_id: { type: integer, format: int64 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        busy:
          type: array
          description: Sap xep theo `start_time` tang dan; co the chong nhau.
          items:
            type: object
            properties:
              start_time: { type: string, format: date-time }
              end_time: { type: string, format: date-time }

    Home:
      allOf:
        - $ref: "#/components/schemas/PublicHome"
        - type: object
          properties:
            google_calendar_id: { type: string }
            is_active: { type: boolean }

    CreateHomeRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { type: string, enum: [home, nest] }
        address: { type: string }
        description: { type: string }

    UpdateHomeRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { type: string, enum: [home, nest] }
        address: { type: string }
        description: { type: string }
        google_calendar_id: { type: string, nullable: true, description: "null = giu nguyen" }
        is_active: { type: boolean, nullable: true, description: "null = giu nguyen" }

    CreateBookingRequest:
      type: object
      required: [home_id, customer_name, customer_phone, start_time, end_time, booking_type]
      properties:
        home_id: { type: integer, format: int64 }
        customer_name: { type: string, maxLength: 100 }
        customer_phone:
          type: string
          maxLength: 20
          description: So di dong VN; moi cach viet ("0900000001", "+84900000001") duoc chuan hoa ve mot dang.
          example: "0900000001"
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, description: Phai sau start_time; toi da 30 ngay. }
        booking_type: { type: string, enum: [hourly, overnight, day] }

    CreateWalkInBookingRequest:
      allOf:
        - $ref: "#/components/schemas/CreateBookingRequest"
        - type: object
          properties:
            paid_cash: { type: boolean, description: "true = xac nhan luon, khong sinh QR" }

    Booking:
      type: object
      description: Ban cho khach — khong co ma khoa cua.
      properties:
        id: { type: integer, format: int64 }
        home_id: { type: integer, format: int64 }
        customer_name: { type: string }
        customer_phone: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        booking_type: { type: string, enum: [hourly, overnight, day] }
        computed_price: { type: integer, format: int64, description: "VND, so nguyen" }
        status:
          type: string
          enum: [pending_payment, confirmed, expired, cancelled, completed, no_show]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Chi co khi `pending_payment`. Qua moc nay cron tra slot lai.
        qr_content: { type: string, description: Noi dung QR chuyen khoan. }

    AdminBooking:
      type: object
      properties:
        id: { type: integer, format: int64 }
        home_id: { type: integer, format: int64 }
        customer_name: { type: string }
        customer_phone: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        booking_type: { type: string, enum: [hourly, overnight, day] }
        computed_price: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending_payment, confirmed, expired, cancelled, completed, no_show]
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        door_lock_code: { type: string, nullable: true }
        lock_code_sent_at:
          type: string
          format: date-time
          nullable: true
          description: Khac null = ma da gui roi, khong gui lai duoc nua.
        google_calendar_event_id: { type: string }
        created_by_admin_id: { type: integer, format: int64, nullable: true, description: Khac null = booking walk-in. }

    PricingRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        category: { type: string, enum: [home, nest] }
        rule_type: { type: string, enum: [hourly, overnight, day] }
        base_hours: { type: integer, nullable: true }
        base_price: { type: integer, format: int64, nullable: true }
        extra_hour_price: { type: integer, format: int64, nullable: true }
        window_start: { type: string, nullable: true, example: "22:00" }
        window_end: { type: string, nullable: true, example: "06:00" }
        flat_price: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean }

    UpsertPricingRuleRequest:
      type: object
      required: [category, rule_type]
      description: |
        `hourly` can `base_hours` + `base_price` + `extra_hour_price`
        (gio le tinh tron len mot gio). `overnight`/`day` can `flat_price`, va
        `window_start`/`window_end` neu muon gioi han gio **bat dau**.
      properties:
        category: { type: string, enum: [home, nest] }
        rule_type: { type: string, enum: [hourly, overnight, day] }
        base_hours: { type: integer, nullable: true }
        base_price: { type: integer, format: int64, nullable: true }
        extra_hour_price: { type: integer, format: int64, nullable: true }
        window_start: { type: string, nullable: true, example: "22:00" }
        window_end: { type: string, nullable: true, example: "06:00" }
        flat_price: { type: integer, format: int64, nullable: true }

    BlockedSlot:
      type: object
      properties:
        id: { type: integer, format: int64 }
        home_id: { type: integer, format: int64 }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        reason: { type: string }
        created_by_admin_id: { type: integer, format: int64, nullable: true }

    Overview:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total_revenue_vnd: { type: integer, format: int64 }
        booking_count: { type: integer, format: int64 }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin, superadmin] }

    AdminListItem:
      $ref: "#/components/schemas/User"

    Session:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Giay. }
        token_type: { type: string, example: Bearer }
        user: { $ref: "#/components/schemas/User" }

security:
  - bearerAuth: []
