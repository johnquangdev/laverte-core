services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laverte
      POSTGRES_PASSWORD: laverte
      POSTGRES_DB: laverte
    ports:
      - "5432:5432"
    volumes:
      - laverte_pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  laverte_pg_data:
